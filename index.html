<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emporio de Mascotas</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="encabezado">
        <h1>🦉 Emporio de Mascotas</h1>
        <p>Elige a tu compañero para Hogwarts</p>
    </header>

    <main>

        <!-- PESTAÑAS DE CATEGORÍAS -->
        <nav class="tabs-categorias" aria-label="Categorías de mascotas">
            <button class="tab-categoria activa" data-categoria="TODAS">Todas</button>
            <button class="tab-categoria" data-categoria="Gatos">🐈 Gatos</button>
            <button class="tab-categoria" data-categoria="Sapos">🐸 Sapos</button>
            <button class="tab-categoria" data-categoria="Lechuzas">🦉 Lechuzas</button>
            <button class="tab-categoria" data-categoria="Ratas">🐀 Ratas</button>
            <button class="tab-categoria" data-categoria="Otras criaturas">✨ Otras</button>
        </nav>

        <div id="mensaje-carga" class="mensaje">
            Cargando mascotas...
        </div>

        <div id="catalogo"></div>

    </main>

    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración -->
    <script src="config.js"></script>

    <!-- Catálogo -->
    <script src="app.js"></script>

</body>
</html>
